# 第二个 polar 并存实例专用（卡 4/5/6/7）。
#
# 最小原则：只改并存所需的几项——输出目录、rollout/gateway/observer 端口、卡池。
# 其余配置与 profile.t2a.yaml 保持一致，避免维护第二套参数语义。
#
# 启动方式：
#   POLAR_PROFILE_SRC=.../profile.bak.yaml \
#   POLAR_PROFILE_RUNTIME=/tmp/polar_profile_bak.yaml \
#   POLAR_RUN_ID=polar_bak_4678 \
#   bash deploy/ascend_operator/launch_polar_and_guide.sh
#
# 为什么不用跳过 stop：launcher 现在会把 POLAR_PROFILE 绑到 POLAR_PROFILE_SRC，再调用
# stop_polar.sh。stop_polar.sh 会按这份 profile 的 output_dir / gateway_url / observer.port
# 只停"自己的"实例，不会碰默认 profile.t2a.yaml 那个 polar。
#
# 端口分配：
#   rollout  12347
#   gateway  9102
#   observer 19092
# 与默认实例的 12345 / 9100 / 19088 完全隔离。

service:
  bind_host: 0.0.0.0
  rollout_url: http://__POLAR_HOST__:12347
  gateway_url: http://__POLAR_HOST__:9102
  sglang_router_url: http://__VIME_ROUTER_HOST__:__VLLM_ROUTER_PORT__
  inference_engine: vllm
  model_served: __MODEL_SERVED__

paths:
  output_dir: output/ascend_operator_bak_4678
  operator_runtime_dir: operator_runtime_t2a

operator_runtime:
  workflow: legacy
  backend: ascendc
  task_assets_dir: __TASK_ASSETS_DIR__
  asc_devkit_dir: __ASC_DEVKIT_DIR__
  budget:
    generation_max: 10
    optimization_max: 4
    interval_seconds: 2
  npu_lease:
    enabled: true
    pool: [4, 5, 6, 7]
    lock_dir: /dev/shm/npu-locks

observer:
  host: 0.0.0.0
  port: 19092

gateway:
  node_id: ascend-node-01-bak
  extra_stale_ports: []
  max_init_workers: 8
  max_run_workers: 64
  max_postrun_workers: 64
  completion_persistence:
    enabled: true
    max_field_bytes: 67108864
    queue_size: 4096

operator:
  profile: operator_npu
  timeout_seconds: 14400.0
  runtime:
    image: ascendc-tilelang:v1
    network: host
    workdir: /opt/workspace/agent_workdir
    env:
      SOC_VERSION: "__SOC_VERSION__"
      ASCENDC_SOC_VERSION: "__SOC_VERSION__"
      ASC_DEVKIT_DIR: "/opt/asc-devkit"
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "262144"

  agent:
    model_name: claude-opus-4-5
    max_turns: 250
    only_project_skills: true
    skills_path: ""
    max_output_tokens: 12288
    inference_timeout_ms: 14400000
    disallowed_tools: "AskUserQuestion CronCreate CronDelete CronList EnterPlanMode EnterWorktree ExitPlanMode ExitWorktree NotebookEdit ScheduleWakeup TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite WebFetch WebSearch"
    append_system_prompt: "Follow ./CLAUDE.md. The user instruction provides the concrete operator name; reference is at input/{op_name}.py. 产出 {op_name}/ 工程并打成单个 tarball 到 output/submission/{op_name}_impl.tar.gz。Do not ask user questions in this non-interactive run. Run the fixed validation entry in the foreground with a long Bash timeout (600000 ms), never run_in_background; if it still gets auto-backgrounded, read the output file it prints to fetch the verdict and error output."
  evaluator:
    judge_command: "bash tools/ascendc_eval_pipeline.sh --op_name {op_name} --impl output/submission/{op_name}_impl.tar.gz --out_dir judge_out"
    submission_path: output/submission/{op_name}_impl.tar.gz
    submission_candidates:
      - output/submission/{op_name}_impl.tar.gz
