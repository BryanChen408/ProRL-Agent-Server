# AscendC profile —— 逐字派生自 profile.vime.yaml(triton 那份一字不动)。
# 【仅 4 处 delta,其余与 profile.vime.yaml 完全一致】:
#   1. paths.operator_runtime_dir  : operator_runtime → operator_runtime_t2a(canonical:skills/CLAUDE/tools/ascendc_eval_pipeline)
#   2. operator.runtime.image      : sandbox:v1 → ascendc-sandbox:v1(cmake<4 + AscendC 工具链)
#   3. operator.evaluator.judge_command : triton_eval_pipeline.sh → ascendc_eval_pipeline.sh(解 tarball→编 kernel→对拍→测速→metrics)
#   4. operator.evaluator.submission_* : 单 .py → tarball(多文件 AscendC 工程跨 fresh-judge 边界)
# 本文件 = profile.ascendc.yaml 的 t2a 版:唯一差异是 operator_runtime_dir 指向新基座。
# 起 run 时用 POLAR_PROFILE 选:
#   POLAR_PROFILE=.../profile.t2a.yaml      新基座(21 skills,TileLang 单路径)
#   POLAR_PROFILE=.../profile.ascendc.yaml  旧基座(11 skills,已实跑验证)
# 改公共项时两份都要改(loader 不支持继承,与其余 6 个 profile 同样是整份复制)。
# workflow=legacy(judge_command 驱动)、budget、npu_lease(0-3)、gateway、operator(timeout/max_turns)全部照 vime 不变。
service:
  bind_host: 0.0.0.0
  rollout_url: http://80.48.5.64:8180
  gateway_url: http://80.48.5.64:8200
  sglang_router_url: http://80.48.5.56:8011
  inference_engine: vllm
  model_served: /home/docker/Qwen3.6-35B-A3B-agentical-ascendc-hf-4t-bf16

paths:
  output_dir: output/ascend_operator
  operator_runtime_dir: operator_runtime_t2a      # ← delta 1

operator_runtime:
  workflow: legacy
  backend: ascendc      # ← delta 5:prepare 走 input/{op}.py + --backend ascendc(triton 侧无此字段=默认 triton)
  # ← delta 6:算子同名 .json(NPUKernelBench 用例规格,get_input_groups() 要读)随 prepare 上传到 input/。
  #   {op}.py 走 vime task_source 内容寻址,.json 没有该通道 → 从数据集目录直传。triton 侧无此字段=不产生该动作。
  task_assets_dir: /home/docker/datasets/op_tasks/op_assets_cudallm_filtered189/op_tasks
  # ← delta 11:asc-devkit(上游 init.sh Step 4 会 clone 的算子开发资料仓)。
  #   $ASC_DEVKIT_DIR 在 21 个 skill 文档里被引用 46 次,是出现最多的环境变量;
  #   ascendc-docs-search 整个 skill 就是查它。只读挂到 /opt/asc-devkit,不进 workdir 拷贝。
  #   钉 9.0.0 分支而非 init.sh 默认的 master:实测 API 名对本机 CANN 9.0.0 头文件的命中率
  #   9.0.0=95% / master=82%,master 独有的 548 个里 53% 本机没有,照着写会引入新的编译错误。
  #   路径映射:skill 写死 docs/zh/api,9.0.0 布局是 docs/api/context,已在仓内建相对软链。
  # ← delta 12:asc_devkit_dir 指向 clean_asc_devkit.py 的 A5-only stub 副本(523+523 页换成
  #   一行「A2/A3 不可用」;保留页字节不动,diff 已核)。实测两个 run 25% 的文档读取(913 次/4M+字符)
  #   打在 950-only 页上,学错签名烧 A 类迭代。原件 asc-devkit-9.0.0 保留,回退=改回该路径。
  asc_devkit_dir: /home/docker/asc-devkit-9.0.0-a2a3
  budget:
    generation_max: 8
    optimization_max: 4
    interval_seconds: 2
  npu_lease:
    enabled: true
    pool: [0, 1, 2, 3, 4, 5, 6, 7]
    lock_dir: /dev/shm/npu-locks

observer:
  host: 0.0.0.0
  port: 18189

gateway:
  node_id: ascend-node-01
  # session 终态后通知 VIME LB 精确删除该 session 的 sticky/KV 压力记账；
  # 通知失败只告警，仍由 LB TTL 与权重边界清理兜底，不影响结果回传。
  release_session_affinity: true
  max_init_workers: 8
  max_run_workers: 64
  max_postrun_workers: 16
  # One Perfetto/Chrome Trace JSON per completed rollout session.
  # Relative paths are resolved under this run's output directory.
  session_trace_json: true
  persist_traces_dir: perfetto_traces
  # RL-Insight integration. /metrics is always local; setting the two URLs also
  # registers this gateway as a scrape target and sends correlated spans to Tempo.
  observability:
    prometheus_enabled: true
    # rl_insight_url: http://127.0.0.1:18080
    # otlp_endpoint: http://127.0.0.1:4318/v1/traces
  completion_persistence:
    enabled: true
    max_field_bytes: 67108864
    queue_size: 4096

operator:
  profile: operator_npu
  # ← delta 13:generation 最多 8 次、首次正确后 optimization 独立最多 4 次；
  #   每个候选都参与编译/对拍/测速，单次长尾可超过 30 min；
  #   加上 Phase 0-3 探索，保留 9000s 会话上限。
  timeout_seconds: 14400.0
  runtime:
    image: ascendc-tilelang:v1                          # ← delta 2
    network: host
    workdir: /opt/workspace/agent_workdir
    env:
      # ← delta 10:SOC_VERSION 注入容器 env。CLAUDE.md 的 Phase 0「硬件信息查询」按
      #   优先级 1(读 $SOC_VERSION)→ 2(npu-smi)→ 3(CANN 安装信息)降级,而本环境
      #   禁止 npu-smi 这类 NPU 探针(多容器共享卡池,探测会干扰别人)。
      #   env.sh 只被固定入口 source,agent 自己的 shell 读不到 —— 不注入这里就必然
      #   落空到优先级 2。注入后永远命中第 1 级,降级路径不会被走到。
      SOC_VERSION: "ascend910b1"
      ASCENDC_SOC_VERSION: "ascend910b1"
      ASC_DEVKIT_DIR: "/opt/asc-devkit"
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "237568"

  agent:
    # ← harness 侧 env:随 `claude` 那条 exec 下发,覆盖容器 env。BASH_*_TIMEOUT_MS 只有
    #   CLI 进程读得到,而 claude_code preset 对它们有 setdefault("600000") 兜底 —— 配在
    #   上面的 runtime.env 会被那个兜底盖掉(实测 133937 就是这么失效的),必须配在这里。
    #   2700000 = 45 min。此前配 30 min,但 BASH_MAX_TIMEOUT_MS 是硬上限、agent 填多少都
    #   突破不了,而实测(run 184112,按 process_info.json 相邻事件时间戳,1941 个样本,是单次
    #   pipeline 耗时的上界)p50 6.8 min / p90 23.6 min / p95 31.0 min / p99 45.2 min —— 恰好
    #   有 5.5% 撞在 30 min 线上被 harness 自动转后台,那一轮 tool result 只剩
    #   "running in background" 而没有 verdict,attempt 记 score=None(靠 builder 侧
    #   claim_backgrounded_verdicts 兜第二层)。45 min 覆盖到 p99。
    env:
      BASH_DEFAULT_TIMEOUT_MS: "2700000"
      BASH_MAX_TIMEOUT_MS: "2700000"
    model_name: claude-opus-4-5
    # ← delta 14:generation 8 次与 optimization 4 次独立计数，每次都可能需要
    #   「读日志→Read 对应 SKILL.md→改代码→重跑」；
    #   加 Phase 0-3 探索和长算子实现，保留 200 轮会话上限。
    max_turns: 150
    # ← delta 8:规则 —— 只保留本项目(canonical/skills)提供的 skill,CLI 自带的一律关掉
    #   (每个 session 白占 4,327 字符 prompt,还可能被误调白烧 turn)。
    #   prepare 按 canonical/skills 的实际内容取补集,写 .claude/settings.json 的
    #   skillOverrides={name:"off"}(既不列进 prompt 也不许模型调用)。名单只能落在 prepare 里:
    #   CLI 的 skillOverrides 是精确名字查表,无通配符;唯一的 allowlist(sessionSkillAllowlist)
    #   只对 Agent SDK 开放,`claude -p` 够不到。
    only_project_skills: true
    # ← delta 9(B 去重):skills 只装项目级一份。polar 的 claude_code harness 会把 skills_path
    #   拷进 agent HOME(用户级),而 prepare 已经把同一份拷进 workdir/.claude/skills(项目级);
    #   两处都装 → 同一 skill 在 prompt 里列两遍(会话无 MCP 时 CLI 不按 name 去重)。
    #   项目级那份不能省:CLAUDE.md 和任务 prompt 里的命令都走相对路径 `.claude/skills/...`。
    #   triton 侧无此字段 = 保持 /opt/canonical/skills(它的 prepare 不拷 skills,必须靠用户级)。
    skills_path: ""
    max_output_tokens: 24576
    inference_timeout_ms: 14400000
    # t2a 只把 skill 当本地知识文件使用，禁止 Skill 工具自动加载/反复调用；其他 profile 不变。
    allowed_tools: "Bash Read Edit Write Grep Glob"
    disallowed_tools: "Skill AskUserQuestion CronCreate CronDelete CronList EnterPlanMode EnterWorktree ExitPlanMode ExitWorktree NotebookEdit ScheduleWakeup TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite WebFetch WebSearch Workflow Agent"
    append_system_prompt: >-
      Follow ./CLAUDE.md. The user instruction provides the concrete operator name; reference is at
      input/{op_name}.py. 产出 {op_name}/ 工程并打成单个 tarball 到
      output/submission/{op_name}_impl.tar.gz。Do not ask user questions in this non-interactive run.
      Skill 工具在本 profile 中禁用；需要知识时直接 Read
      .claude/skills/<skill-name>/SKILL.md 及其明确引用的 references，禁止尝试调用 Skill。
      完成判定(硬规则):固定入口的 operator_valid=true 只表示正确性通过，不表示任务完成；
      是否允许结束只认 task_complete。task_complete=false 时 Stop hook 会阻止结束，必须按
      next_step 优化 kernel 并重跑固定入口；task_complete=true（达到目标或 optimization 预算耗尽）
      才可总结。两者都没拿到就先重跑固定入口，不要自行判定已完成。
      Run the fixed validation entry in the foreground, never run_in_background;调用它时 Bash 的
      timeout 参数必须显式填 2700000(45 分钟)——禁止省略 timeout,也不要填更小的值
      (小于实际耗时会被自动转后台);if it still gets auto-backgrounded, read the output file it
      prints to fetch the verdict and error output.
      输出纪律(硬规则,违反会直接判死本会话):思考占输出预算,写太长会顶穿预算、本轮 content
      为空,连续几轮会话就被终止 —— 每轮只想「下一步动作」并立刻输出一个 tool call;不要把完整
      方案设计或整份文件草稿写进思考。写代码分小块:先写能编译的粗版(每个 Write/Edit 只写一段
      或一个函数),再逐段补全;拿不准的地方先写出代码跑出真实报错再对着改,不要在思考里预解决
      所有问题。如果收到「Output token limit hit」提示:不要重新规划、不要从头再想,立即用更小的块
      直接重试输出。
  evaluator:
    # ← delta 3+4:AscendC 判分入口 + tarball 提交(golden model.py 在 tarball 内,无需 --task)
    judge_command: "bash /opt/workspace/agent_workdir/tools/ascendc_eval_pipeline.sh --op_name {op_name} --impl output/submission/{op_name}_impl.tar.gz --out_dir judge_out"
    submission_path: output/submission/{op_name}_impl.tar.gz
    submission_candidates:
      - output/submission/{op_name}_impl.best.tar.gz
      - output/submission/{op_name}_impl.tar.gz
    metrics_path: judge_out/metrics.json
