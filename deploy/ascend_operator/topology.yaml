# Polar topology template for slime-owned SGLang router.
# render_topology_template() replaces gateway.nodes[].inference.base_url with
# http://{args.sglang_router_ip}:{args.sglang_router_port}.

rollout:
  host: 127.0.0.1
  port: 8080
  public_url: http://127.0.0.1:8080
  save_dir: ./rollout_results
  default_operator_profile: math_npu   # [math 验证期] vime 不传 profile → polar 用此默认;跑回 operator 改回 operator_npu
  operator_profiles:
    operator_npu:
      timeout_seconds: 3600.0
      operator_runtime_dir: operator_runtime
      runtime:
        backend: docker
        image: sandbox:v1
        network: host
        workdir: /opt/workspace/agent_workdir
        env:
          DISABLE_AUTOUPDATER: "1"
          API_TIMEOUT_MS: "14400000"
          CLAUDE_CODE_MAX_RETRIES: "1"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32768"
          POLAR_ANTHROPIC_DEFAULT_MAX_TOKENS: "32768"
          POLAR_NPU_LEASE_POOL: "8,9,10,11"
          POLAR_NPU_LOCK_DIR: /dev/shm/npu-locks
        kwargs:
          ascend:
            pool: "8,9,10,11"
            lock_dir: /dev/shm/npu-locks
            lease_at_start: false
          volumes:
            - operator_runtime:/opt/canonical:ro
            - operator_runtime/tools:/opt/workspace/agent_workdir/tools:ro
        prepare:
          - type: upload_file
            source: output/ascend_operator/op_assets/op_tasks/{op_name}.py
            target: /opt/workspace/agent_workdir/src/{op_name}.py
          - type: exec
            command: >-
              python3 /opt/canonical/runtime/prepare_operator_workdir.py
              --op-name {op_name}
              --workdir /opt/workspace/agent_workdir
              --require-claude
              --no-stub
              --readonly-tools
        eval_prepare:
          - type: upload_file
            source: output/ascend_operator/op_assets/op_tasks/{op_name}.py
            target: /opt/workspace/agent_workdir/src/{op_name}.py
          - type: exec
            command: >-
              python3 /opt/canonical/runtime/prepare_operator_workdir.py
              --op-name {op_name}
              --workdir /opt/workspace/agent_workdir
              --no-stub
              --readonly-tools
      agent:
        harness: claude_code
        model_name: claude-opus-4-5
        skills_path: /opt/canonical/skills
        settings:
          max_turns: 45
          disallowed_tools: "AskUserQuestion CronCreate CronDelete CronList EnterPlanMode EnterWorktree ExitPlanMode ExitWorktree NotebookEdit ScheduleWakeup TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite WebFetch WebSearch"
          append_system_prompt: "Follow ./CLAUDE.md. The user instruction provides the concrete operator name and src/output paths. Do not ask user questions in this non-interactive run."
      evaluator:
        strategy: operator_judge
        refresh_runtime: true
        runtime:
          backend: docker
          image: sandbox:v1
          network: host
          workdir: /opt/workspace/agent_workdir
          env:
            DISABLE_AUTOUPDATER: "1"
            POLAR_NPU_LEASE_POOL: "8,9,10,11"
            POLAR_NPU_LOCK_DIR: /dev/shm/npu-locks
          kwargs:
            ascend:
              pool: "8,9,10,11"
              lock_dir: /dev/shm/npu-locks
              lease_at_start: false
            volumes:
              - operator_runtime:/opt/canonical:ro
              - operator_runtime/tools:/opt/workspace/agent_workdir/tools:ro
          eval_prepare:
            - type: upload_file
              source: output/ascend_operator/op_assets/op_tasks/{op_name}.py
              target: /opt/workspace/agent_workdir/src/{op_name}.py
            - type: exec
              command: >-
                python3 /opt/canonical/runtime/prepare_operator_workdir.py
                --op-name {op_name}
                --workdir /opt/workspace/agent_workdir
                --no-stub
                --readonly-tools
        config:
          lazy_refresh_runtime: true
          op_name: "{op_name}"
          judge_command: >-
            bash tools/triton_eval_pipeline.sh
            --op_name {op_name}
            --impl output/submission/{op_name}_impl.py
            --task src/{op_name}.py
            --out_dir judge_out
          submission_path: output/submission/{op_name}_impl.py
          metrics_path: judge_out/metrics.json
          workdir: /opt/workspace/agent_workdir
      builder:
        strategy: prefix_merging
        config: {}
    # 数学 agentic 管线验证 profile —— 照 operator_npu 结构,去掉所有算子内容:
    #   无 prepare(不上传 {op_name}.py)、无 ascend NPU 租借(agent 纯 CPU 解题)、
    #   skill 换 math-solver、evaluator 换 math_judge(纯 in-process,无 docker/judge_command)。
    math_npu:
      timeout_seconds: 1200.0
      operator_runtime_dir: math_runtime
      runtime:
        backend: docker
        image: sandbox:v1
        network: host
        workdir: /opt/workspace/agent_workdir
        env:
          DISABLE_AUTOUPDATER: "1"
          API_TIMEOUT_MS: "14400000"
          CLAUDE_CODE_MAX_RETRIES: "1"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "32768"
          POLAR_ANTHROPIC_DEFAULT_MAX_TOKENS: "32768"
        kwargs:
          volumes:
            - math_runtime:/opt/canonical:ro
      agent:
        harness: claude_code
        model_name: claude-opus-4-5
        skills_path: /opt/canonical/skills
        settings:
          max_turns: 20
          disallowed_tools: "AskUserQuestion CronCreate CronDelete CronList EnterPlanMode EnterWorktree ExitPlanMode ExitWorktree NotebookEdit ScheduleWakeup TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite WebFetch WebSearch"
          append_system_prompt: "You are solving a competition math problem with a single integer answer. You MAY write and run Python (via the Bash tool) to compute or verify. Reason step by step, then give the final answer on its own line exactly as the problem asks (a line 'Answer: <integer>'). Do not ask the user any questions in this non-interactive run."
      evaluator:
        strategy: math_judge
        config:
          format_bonus: 0.0
      builder:
        strategy: prefix_merging
        config: {}

gateway:
  heartbeat_interval_seconds: 30
  nodes:
    - id: ascend-node-01
      host: 127.0.0.1
      port: 8100
      public_url: http://127.0.0.1:8100
      max_init_workers: 8
      max_run_workers: 32
      max_postrun_workers: 32
      model_served: ""
      inference:
        engine: sglang
        base_url: http://127.0.0.1:4077
